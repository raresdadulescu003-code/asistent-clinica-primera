[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clinic-agent"
version = "0.1.0"
description = "Agent conversațional informațional pentru Clinica Primera"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "anthropic>=0.40",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "apscheduler>=3.10",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

# Layout src/: pachetul nu e importabil accidental din directorul curent,
# ci doar după instalare. Așa testele rulează pe codul instalat, nu pe cel din cwd.
[tool.hatch.build.targets.wheel]
packages = ["src/clinic_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
